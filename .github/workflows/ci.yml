name: SportHub CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "test/**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: sporthub-api

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: sporthub-api/pom.xml

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B clean verify

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: sporthub-api/target/surefire-reports/

  docker-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sporthub-api
    steps:
      - uses: actions/checkout@v7
      - name: Build from source and start isolated MySQL
        run: docker compose -p sporthub-ci -f compose.verify.yml up -d --build
      - name: Verify API and save seed IDs
        shell: pwsh
        run: ../scripts/verify-venue-court.ps1 -SnapshotPath ../seed-snapshot.json
      - name: Restart services
        run: docker compose -p sporthub-ci -f compose.verify.yml restart
      - name: Verify seed after restart
        shell: pwsh
        run: ../scripts/verify-venue-court.ps1 -SnapshotPath ../seed-snapshot.json -AfterRestart
      - name: Stop verification stack
        if: always()
        run: docker compose -p sporthub-ci -f compose.verify.yml down -v