# ===============================
# APPLICATION
# ===============================
spring.application.name=sporthub-api
spring.profiles.default=dev

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# AZURE BLOB STORAGE
# ===============================

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER:sporthub-images}

# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# ERROR HANDLING
# ===============================

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# ===============================
# ACTUATOR / OBSERVABILITY
# ===============================

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

# ===============================
# LOGGING / REQUEST ID
# ===============================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n